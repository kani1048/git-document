[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-docmount"
version = "0.1.0"
description = "Manage orphan document branches and worktree mounts"
requires-python = ">=3.12"

[project.scripts]
git-docmount = "git_docmount.__main__:main"

[tool.setuptools.packages.find]
include = ["git_docmount*"]
